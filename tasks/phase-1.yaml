# The ledger's phase 1: the tasks that drive every commit but a feat, a fix or
# a docs, each named in its commit's Task footer (itos commit --task T-2).
# A task:
#
#   - id: T-2
#     type: chore # one of commits.types
#     title: What it is
#     why: Why it is worth doing. # optional
#     done_when: # the checks that prove it, which itos task T-2 runs
#       - run: a command that exits 0 once it is done
- id: T-1
  type: chore
  title: Adopt itos
  why: >
    The commit that adds itos.yaml, this ledger and the work registry names it:
    itos commit --task T-1.
  done_when:
    - run: itos config check
- id: T-2
  type: test
  title: Record the code proof of version --json under this project's names
  why: >
    The version --json feat (f53d857) replays the template's T-34, and this replays its third
    commit, the template's 217e25c, which recorded that change's mutation proof. The template's
    records could not be reused: a render replaces the template's name, owner and module inside the
    sources and test files those records and itos-cc.yaml's exceptions hash, so every function whose
    body or tests hold one no longer matches its record, and CI's code proof refused the feat (run
    38087430541). Like any project that changes its code, this one records its own: a mutation run
    over cmd and internal with every test and fail-uncovered, and the excepted len(args) mutant in
    run renewed under this project's hash, its reason unchanged, once it is checked to be the same
    equivalent mutant.
