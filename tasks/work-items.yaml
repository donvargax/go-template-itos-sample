# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: null # the ledger's phase 1, owned by nobody: a handle, or null
items:
  - id: T-2
    title: Record the code proof of version --json under this project's names
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-3
    title: Take the template release v0.1.0 by itos-template update
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: task
    why: >
      This project was rendered from the template's branch heads before the template had a release,
      and it is behind on every template change since: the engineering guide's paragraph on made
      projects, the documents' wording, doc-caps skipping a missing document and the itos pin its
      workflows' action names. itos-template update brings it to v0.1.0, the template's first
      release, in one step: a merge of the render it was made from and the release's render, its own
      changes kept where they conflict (its docs/go.md section, its mutation records and
      itos-cc.yaml), and itos-policy.yaml, which setup removed when it became this project's
      itos.yaml, left removed. Its itos.yaml pin moves to the version the release's policy names, so
      the workflows' donvargax/itos action and the pin agree, and AGENTS.md's rules are regenerated
      from its own config. The update is no release of this project.
