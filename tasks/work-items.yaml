# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: null # the ledger's phase 1, owned by nobody: a handle, or null
items:
  - id: T-2
    title: Record the code proof of version --json under this project's names
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: task
    why: >
      The version --json feat (f53d857) replays the template's T-34, and this replays its third
      commit, the template's 217e25c, which recorded that change's mutation proof. The template's
      records could not be reused: a render replaces the template's name, owner and module inside
      the sources and test files those records and itos-cc.yaml's exceptions hash, so every function
      whose body or tests hold one no longer matches its record, and CI's code proof refused the
      feat (run 38087430541). Like any project that changes its code, this one records its own: a
      mutation run over cmd and internal with every test and fail-uncovered, and the excepted
      len(args) mutant in run renewed under this project's hash, its reason unchanged, once it is
      checked to be the same equivalent mutant.
